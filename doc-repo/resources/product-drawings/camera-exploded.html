<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSLR Camera — Exploded 3D Parts View</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070a0e;
    --panel: #0d1218;
    --line: #1c2732;
    --line-bright: #2b3947;
    --ink: #cdd8e3;
    --ink-dim: #8090a0;
    --ink-faint: #566472;
    --cyan: #35d6e6;
    --amber: #f6b64b;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --display: "Chakra Petch", var(--sans);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    overflow: hidden;
  }

  #app { display: grid; grid-template-columns: 336px 1fr; height: 100vh; }

  /* ---------------- sidebar ---------------- */
  #side {
    display: flex; flex-direction: column; min-height: 0;
    background: linear-gradient(180deg, #0d1218, #090d12);
    border-right: 1px solid var(--line);
  }
  #side header { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font: 600 10px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--cyan); opacity: .85;
  }
  #side h1 {
    font: 600 21px/1.15 var(--display); margin: 8px 0 0; letter-spacing: .01em;
  }
  #side .sub { margin: 6px 0 0; color: var(--ink-dim); font-size: 12px; }

  .controls { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .slider { display: block; }
  .slider .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
  }
  .slider output { color: var(--cyan); font-size: 11px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 20px;
    background: transparent; margin: 8px 0 2px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; background: linear-gradient(90deg, var(--line-bright), var(--line)); border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; margin-top: -5px;
    border-radius: 50%; background: var(--cyan); border: 2px solid #06222a;
    box-shadow: 0 0 10px rgba(53, 214, 230, .55);
  }
  .toggles {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px;
    font: 500 11px/1 var(--mono); color: var(--ink-dim);
  }
  .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .toggles input { accent-color: #35d6e6; }
  .toggles button {
    margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink);
    background: #121a22; border: 1px solid var(--line-bright); border-radius: 3px;
    padding: 5px 9px; cursor: pointer;
  }
  .toggles button:hover { border-color: var(--cyan); color: #fff; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; }
  #list::-webkit-scrollbar { width: 9px; }
  #list::-webkit-scrollbar-thumb { background: #1d2833; border-radius: 9px; border: 2px solid #0b1015; }
  .row-item {
    display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 3px;
    color: var(--ink-dim); font: 500 12px/1.3 var(--sans); padding: 6px 8px; cursor: pointer;
  }
  .row-item i {
    font: 500 10px/1.5 var(--mono); font-style: normal; color: var(--ink-faint); min-width: 18px;
  }
  .row-item:hover { background: #101820; color: var(--ink); }
  .row-item.active { background: #0f2329; border-color: #234a53; color: #fff; }
  .row-item.active i { color: var(--cyan); }

  #detail { border-top: 1px solid var(--line); padding: 14px 18px 18px; min-height: 132px; }
  #detail .num {
    font: 600 10px/1 var(--mono); letter-spacing: .16em; color: var(--cyan); text-transform: uppercase;
  }
  #detail h3 { font: 600 15px/1.2 var(--display); margin: 7px 0 4px; color: #fff; }
  #detail p { margin: 0; color: var(--ink-dim); font-size: 12px; line-height: 1.5; }

  /* ---------------- stage ---------------- */
  #stage {
    position: relative; overflow: hidden;
    background: radial-gradient(115% 85% at 63% 36%, #17222d 0%, #0a0f14 56%, #06080b 100%);
  }
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(90, 140, 160, .05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(90, 140, 160, .05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(80% 70% at 50% 50%, #000 30%, transparent 100%);
  }
  #stage canvas { position: absolute; inset: 0; display: block; }
  #leaders { position: absolute; inset: 0; pointer-events: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }

  .chip {
    position: absolute; left: 0; top: 0; display: flex; gap: 7px; align-items: center;
    padding: 3px 9px 3px 7px; border: 1px solid var(--line-bright); border-radius: 999px;
    background: rgba(8, 12, 17, .84); backdrop-filter: blur(3px);
    font: 500 11px/1 var(--mono); color: var(--ink); white-space: nowrap; cursor: pointer;
    pointer-events: auto; transition: opacity .2s, border-color .2s, color .2s;
  }
  .chip b { color: var(--ink-faint); font-weight: 600; }
  .chip:hover { border-color: #4d7f8c; color: #fff; }
  .chip.muted { opacity: .3; }
  .chip.active { border-color: var(--cyan); color: #fff; }
  .chip.active b { color: var(--cyan); }
  .chip.active { box-shadow: 0 0 0 1px rgba(53, 214, 230, .3), 0 0 20px rgba(53, 214, 230, .22); }

  #hint {
    position: absolute; left: 16px; bottom: 14px; pointer-events: none;
    font: 500 11px/1 var(--mono); color: var(--ink-faint); letter-spacing: .04em;
  }
  #badge {
    position: absolute; right: 16px; bottom: 14px; pointer-events: none;
    font: 500 10px/1 var(--mono); color: var(--ink-faint); letter-spacing: .12em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <div class="eyebrow">ChenWeb · 3D reference</div>
      <h1>DSLR Camera</h1>
      <p class="sub">Exploded parts view · <span id="cnt">26</span> components</p>
    </header>

    <div class="controls">
      <label class="slider">
        <span class="row"><span>Explode</span><output id="expOut">62%</output></span>
        <input id="explode" type="range" min="0" max="100" value="62" />
      </label>
      <div class="toggles">
        <label><input id="tLabels" type="checkbox" checked /> Labels</label>
        <label><input id="tSpin" type="checkbox" checked /> Auto-orbit</label>
        <button id="reset">Reset view</button>
      </div>
    </div>

    <div id="list"></div>

    <div id="detail">
      <div class="num">—</div>
      <h3>Pick a component</h3>
      <p>Click any part in the scene, or a row in the list, to isolate and describe it.</p>
    </div>
  </aside>

  <main id="stage">
    <svg id="leaders"></svg>
    <div id="labels"></div>
    <div id="hint">drag to orbit · scroll to zoom · click a part</div>
    <div id="badge">26 parts · not to scale</div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   Renderer / scene
   ============================================================ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
scene.environmentIntensity = 0.5;

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2); keyLight.position.set(6, 9, 9);
const fillLight = new THREE.DirectionalLight(0xa8d2ff, 0.85); fillLight.position.set(-9, 3, 5);
const rimLight = new THREE.DirectionalLight(0xffd6a0, 1.15); rimLight.position.set(-5, 7, -10);
scene.add(new THREE.HemisphereLight(0x8fb4cc, 0x090c10, 0.5), keyLight, fillLight, rimLight);

const HOME = new THREE.Vector3(7.9, 5.6, 11.7);
const LOOK = new THREE.Vector3(0, 0.42, 0.95);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(LOOK);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 46;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.addEventListener('start', () => { targetGoal = null; });
let spinOn = true, spinPaused = false;   // auto-orbit pauses while a label is hovered

/* ============================================================
   Materials
   ============================================================ */
const std = (o) => new THREE.MeshStandardMaterial(o);
const SCREEN_TEX = screenTex();   // one canvas, reused as colour + emissive map
const MAT = {
  frame:      std({ color: 0x30363e, roughness: 0.42, metalness: 0.82 }),
  shell:      std({ color: 0x1b2027, roughness: 0.58, metalness: 0.34 }),
  metal:      std({ color: 0x9aa5af, roughness: 0.3, metalness: 1.0 }),
  chrome:     std({ color: 0xd9e0e6, roughness: 0.12, metalness: 1.0 }),
  brass:      std({ color: 0xb6934f, roughness: 0.32, metalness: 1.0 }),
  rubber:     std({ color: 0x0d0f12, roughness: 1.0, metalness: 0.0 }),
  red:        std({ color: 0xb0392b, roughness: 0.35, metalness: 0.3 }),
  lamp:       std({ color: 0x2a343c, roughness: 0.2, metalness: 0.1, emissive: 0x8a1f14, emissiveIntensity: 0.7 }),
  barrel:     std({ color: 0x14181d, roughness: 0.5, metalness: 0.55 }),
  barrelIn:   std({ color: 0x14181d, roughness: 0.5, metalness: 0.55, side: THREE.DoubleSide }),
  blade:      std({ color: 0x22262c, roughness: 0.35, metalness: 0.85, side: THREE.DoubleSide }),
  mirror:     std({ color: 0xd6dee6, roughness: 0.05, metalness: 1.0, side: THREE.DoubleSide }),
  pcb:        std({ color: 0x123a2a, roughness: 0.62, metalness: 0.2 }),
  chip:       std({ color: 0x101418, roughness: 0.5, metalness: 0.2 }),
  glass:      new THREE.MeshPhysicalMaterial({ color: 0xbcdcea, roughness: 0.03, metalness: 0, transmission: 0.92, thickness: 0.5, ior: 1.55, clearcoat: 1, clearcoatRoughness: 0.03, side: THREE.DoubleSide }),
  glassFront: new THREE.MeshPhysicalMaterial({ color: 0x9fd2e6, roughness: 0.02, metalness: 0.1, transmission: 0.86, thickness: 0.7, ior: 1.6, iridescence: 0.55, iridescenceIOR: 1.9, clearcoat: 1, side: THREE.DoubleSide }),
  prism:      new THREE.MeshPhysicalMaterial({ color: 0xc4e4f0, roughness: 0.02, metalness: 0, transmission: 0.9, thickness: 0.8, ior: 1.52, clearcoat: 1, emissive: 0x0d3b45, emissiveIntensity: 0.45, side: THREE.DoubleSide }),
  eyeGlass:   std({ color: 0x0d1a20, roughness: 0.15, metalness: 0.4, emissive: 0x0d3b45, emissiveIntensity: 0.4, side: THREE.DoubleSide }),
  sensor:     std({ map: sensorTex(), roughness: 0.22, metalness: 0.55, emissive: 0x0a2b33, emissiveIntensity: 0.5 }),
  curtain:    std({ map: curtainTex(), roughness: 0.75, metalness: 0.15, side: THREE.DoubleSide }),
  screenUI:   std({ map: SCREEN_TEX, roughness: 0.22, metalness: 0.1, emissive: 0xffffff, emissiveIntensity: 0.42, emissiveMap: SCREEN_TEX }),
  label:      std({ color: 0xb9c2c9, roughness: 0.7, metalness: 0.1 })
};

/* ============================================================
   Geometry helpers
   ============================================================ */
function rbox(w, h, d, radius = 0.04) { return new RoundedBoxGeometry(w, h, d, 3, radius); }

function put(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  parent.add(m);
  return m;
}

/** Fluted / knurled cylinder — the ribbed rubber of dials and focus rings. */
function fluted(r, h, flutes = 30, amp = 0.04, seg = 144) {
  const geo = new THREE.CylinderGeometry(r, r, h, seg, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const k = 1 + amp * Math.sin(Math.atan2(z, x) * flutes) * (Math.hypot(x, z) / r);
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  geo.computeVertexNormals();
  return geo;
}

/** Flat washer / ring in the XY plane (axis = Z, the optical axis). */
function washer(rOut, rIn, h) {
  const s = new THREE.Shape();
  s.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  const hole = new THREE.Path();
  hole.absarc(0, 0, rIn, 0, Math.PI * 2, true);
  s.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 56 });
  geo.translate(0, 0, -h / 2);
  return geo;
}

/** Biconvex lens element (a squashed sphere). */
function lensElement(r, k = 0.35) {
  const geo = new THREE.SphereGeometry(r, 44, 26);
  geo.scale(1, 1, k);
  geo.computeVertexNormals();
  return geo;
}

/** Rounded rectangular plate, extruded along Z, with circular / rect holes. */
function plate(w, h, d, r, holes = []) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  for (const hd of holes) {
    const p = new THREE.Path();
    if (hd.type === 'rect') {
      const hx = hd.x - hd.w / 2, hy = hd.y - hd.h / 2, hr = hd.r || 0;
      p.moveTo(hx + hr, hy);
      p.lineTo(hx + hd.w - hr, hy); p.quadraticCurveTo(hx + hd.w, hy, hx + hd.w, hy + hr);
      p.lineTo(hx + hd.w, hy + hd.h - hr); p.quadraticCurveTo(hx + hd.w, hy + hd.h, hx + hd.w - hr, hy + hd.h);
      p.lineTo(hx + hr, hy + hd.h); p.quadraticCurveTo(hx, hy + hd.h, hx, hy + hd.h - hr);
      p.lineTo(hx, hy + hr); p.quadraticCurveTo(hx, hy, hx + hr, hy);
    } else {
      p.absarc(hd.x, hd.y, hd.r, 0, Math.PI * 2, true);
    }
    s.holes.push(p);
  }
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: d, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2, curveSegments: 40
  });
  geo.translate(0, 0, -d / 2);
  return geo;
}

/** Viewfinder-hump side profile (shape x = camera rear, shape y = up). */
function humpProfile(s, k = 1) {
  s.moveTo(-0.52 * k, -0.18 * k);
  s.lineTo(0.52 * k, -0.18 * k);
  s.lineTo(0.47 * k, 0.13 * k);
  s.lineTo(-0.10 * k, 0.18 * k);
  s.lineTo(-0.52 * k, 0.02 * k);
  s.closePath();
  return s;
}
function humpGeo(k, width) {
  const geo = new THREE.ExtrudeGeometry(humpProfile(new THREE.Shape(), k), {
    depth: width, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 6
  });
  geo.translate(0, 0, -width / 2);
  geo.rotateY(Math.PI / 2);
  return geo;
}

/* ---- procedural textures ---- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function sensorTex() {
  return canvasTex(256, 256, (c) => {
    c.fillStyle = '#0b1418'; c.fillRect(0, 0, 256, 256);
    const px = 8;
    for (let y = 0; y < 256; y += px) for (let x = 0; x < 256; x += px) {
      const a = (x / px) % 2, b = (y / px) % 2;
      c.fillStyle = (a === 0 && b === 0) ? '#1e4f5b' : (a === 1 && b === 0) ? '#16414b'
                  : (a === 0 && b === 1) ? '#15494c' : '#1c5a66';
      c.fillRect(x, y, px, px);
    }
  });
}
function curtainTex() {
  return canvasTex(256, 128, (c) => {
    c.fillStyle = '#0a0b0d'; c.fillRect(0, 0, 256, 128);
    for (let y = 0; y < 128; y += 8) {
      c.fillStyle = (y / 8) % 2 ? '#16191e' : '#0d0f12';
      c.fillRect(0, y, 256, 8);
    }
    c.fillStyle = '#2c333b'; c.fillRect(0, 0, 5, 128); c.fillRect(251, 0, 5, 128);
  });
}
function screenTex() {
  return canvasTex(512, 360, (c) => {
    const g = c.createLinearGradient(0, 0, 0, 360);
    g.addColorStop(0, '#123039'); g.addColorStop(1, '#071218');
    c.fillStyle = g; c.fillRect(0, 0, 512, 360);
    c.fillStyle = '#17545e'; c.fillRect(0, 186, 512, 74);
    c.fillStyle = '#0e2430'; c.fillRect(0, 0, 512, 54);
    c.strokeStyle = '#35d6e6'; c.lineWidth = 3; c.strokeRect(186, 118, 148, 108);
    c.fillStyle = '#dff5f8'; c.font = '600 26px ui-monospace, monospace';
    c.fillText('M   1/250   F2.8   ISO 100', 22, 40);
    c.fillStyle = '#8fd6e0'; c.font = '500 20px ui-monospace, monospace';
    c.fillText('AF-S   ▮▮▮▮▮▮▯▯   112   RAW+J', 22, 338);
  });
}

/* ============================================================
   Part definitions  (assembled positions are absolute; the group
   offset IS the explode vector, scaled 0→1 by the slider)
   ============================================================ */
const AXIS = 0.06; // optical axis height inside the body

const PARTS = [
{
  id: 'chassis', n: 'Body chassis', tag: 'structural core', ex: [0, 0, 0], ang: 190,
  desc: 'Machined magnesium-alloy frame with the mirror box and lens throat. Every other component — shutter, sensor, PCB, shell panels — bolts to it.',
  build(g) {
    const W = 2.9, H = 1.85, D = 1.2, t = 0.07;
    // floor
    put(g, rbox(W, t, D, 0.02), MAT.frame, [0, -H / 2, 0]);
    // roof: two rails only — the mirror box, shutter and sensor lift out of the gap
    put(g, rbox(0.68, t, D, 0.02), MAT.frame, [-1.11, H / 2, 0]);
    put(g, rbox(0.68, t, D, 0.02), MAT.frame, [1.11, H / 2, 0]);
    // rear rim: opening for the sensor plate, mainboard and LCD
    put(g, rbox(W, 0.08, t, 0.02), MAT.frame, [0, 0.885, -D / 2]);
    put(g, rbox(W, 0.08, t, 0.02), MAT.frame, [0, -0.885, -D / 2]);
    put(g, rbox(0.08, H, t, 0.02), MAT.frame, [-1.41, 0, -D / 2]);
    put(g, rbox(0.08, H, t, 0.02), MAT.frame, [1.41, 0, -D / 2]);
    // lens throat
    put(g, new THREE.CylinderGeometry(0.74, 0.74, 0.16, 44, 1, true), MAT.barrelIn, [0, AXIS, 0.52], [Math.PI / 2, 0, 0]);
  }
},
{
  id: 'front', n: 'Front cover', tag: 'shell', ex: [0, 0, 0.78], ang: 205,
  desc: 'Moulded front shell: the lens-mount bore, the AF-assist lamp, the lens-release button and the bayonet boss.',
  build(g) {
    put(g, plate(3.2, 2.1, 0.09, 0.13, [
      { x: 0, y: AXIS, r: 0.7 }, { x: 0.62, y: -0.6, r: 0.055 }
    ]), MAT.shell, [0, 0, 0.705]);
    put(g, washer(0.9, 0.86, 0.1), MAT.shell, [0, AXIS, 0.72]);
    put(g, new THREE.CylinderGeometry(0.075, 0.075, 0.08, 20), MAT.metal, [-0.86, -0.5, 0.76], [Math.PI / 2, 0, 0]);
    put(g, new THREE.SphereGeometry(0.052, 16, 12), MAT.lamp, [0.62, -0.6, 0.735]);
    put(g, new THREE.BoxGeometry(0.46, 0.09, 0.02), MAT.chrome, [-0.98, 0.62, 0.755]);
  }
},
{
  id: 'back', n: 'Back cover', tag: 'shell', ex: [0, 0, -0.78], ang: 28,

/* ============================================================
   Build the scene graph
   ============================================================ */
const root = new THREE.Group();
scene.add(root);
const HL = new THREE.Color(0x35d6e6);

PARTS.forEach((def, i) => {
  def.no = i + 1;
  const g = new THREE.Group();
  def.build(g);
  g.traverse((o) => {
    if (!o.isMesh) return;
    o.material = o.material.clone();
    o.userData.baseEmissive = o.material.emissive.clone();
    o.userData.baseIntensity = o.material.emissiveIntensity;
  });
  const bb = new THREE.Box3().setFromObject(g);
  def.anchor = def.anchor ? new THREE.Vector3(...def.anchor) : bb.getCenter(new THREE.Vector3());
  g.userData.part = def;
  g.userData.explode = new THREE.Vector3(...def.ex);
  def.group = g;
  root.add(g);
});

function setHighlight(def, on) {
  def.group.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    if (on) { m.emissive.copy(HL); m.emissiveIntensity = 0.5; }
    else { m.emissive.copy(o.userData.baseEmissive); m.emissiveIntensity = o.userData.baseIntensity; }
  });
}

/* ============================================================
   Labels + leader lines
   ============================================================ */
const labelLayer = document.getElementById('labels');
const leaderSvg = document.getElementById('leaders');
const SVGNS = 'http://www.w3.org/2000/svg';
const labels = new Map();
const centerNDC = new THREE.Vector2();
const tmpV = new THREE.Vector3();

for (const def of PARTS) {
  const el = document.createElement('div');
  el.className = 'chip';
  el.innerHTML = `<b>${String(def.no).padStart(2, '0')}</b><span>${def.n}</span>`;
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('click', (e) => { e.stopPropagation(); select(def); });
  el.addEventListener('pointerenter', () => { if (spinOn) { controls.autoRotate = false; spinPaused = true; } });
  el.addEventListener('pointerleave', () => { if (spinPaused) { controls.autoRotate = true; spinPaused = false; } });
  labelLayer.appendChild(el);

  const line = document.createElementNS(SVGNS, 'line');
  line.setAttribute('stroke', 'rgba(53,214,230,.42)');
  line.setAttribute('stroke-width', '1');
  const dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('r', '2.2');
  dot.setAttribute('fill', '#35d6e6');
  leaderSvg.append(line, dot);

  labels.set(def, { el, line, dot, x: 0, y: 0, w: 0, h: 0, ready: false });
}

const live = [];   // scratch list, reused every frame
let frame = 0;

function updateLabels() {
  frame++;
  const w = stage.clientWidth, h = stage.clientHeight;
  tmpV.copy(controls.target).project(camera);
  centerNDC.set((tmpV.x * 0.5 + 0.5) * w, (-tmpV.y * 0.5 + 0.5) * h);
  live.length = 0;

  for (const def of PARTS) {
    const L = labels.get(def);
    tmpV.copy(def.anchor).add(def.group.position).project(camera);
    const sx = (tmpV.x * 0.5 + 0.5) * w;
    const sy = (-tmpV.y * 0.5 + 0.5) * h;
    const visible = showLabels && tmpV.z < 1 && sx > -240 && sx < w + 240 && sy > -240 && sy < h + 240;

    if (!visible) {
      L.el.style.display = 'none'; L.line.style.display = 'none'; L.dot.style.display = 'none';
      continue;
    }
    L.el.style.display = ''; L.line.style.display = ''; L.dot.style.display = '';
    // chip size is needed by the relaxation pass; refresh it periodically
    // (the web font lands after the first frame and changes the widths)
    if (!L.w || frame % 20 === 0) { L.w = L.el.offsetWidth || 92; L.h = L.el.offsetHeight || 22; }

    // Fan the chip away from the model centre, biased by the hand-tuned angle.
    let dx = sx - centerNDC.x, dy = sy - centerNDC.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const a = def.ang * Math.PI / 180;
    let ux = dx * 0.5 + Math.cos(a) * 0.8;
    let uy = dy * 0.5 + Math.sin(a) * 0.8;
    const ul = Math.hypot(ux, uy) || 1;
    ux /= ul; uy /= ul;
    const dist = 68 + Math.min(120, len * 0.28);

    live.push({ L, sx, sy, hw: L.w / 2, hh: L.h / 2, x: sx + ux * dist, y: sy + uy * dist });
  }

  // Relax the chips apart so labels never sit on top of each other.
  for (let pass = 0; pass < 28; pass++) {
    for (let i = 0; i < live.length; i++) {
      const A = live[i];
      for (let j = i + 1; j < live.length; j++) {
        const B = live[j];
        const dx = B.x - A.x, dy = B.y - A.y;
        const ox = (A.hw + B.hw + 6) - Math.abs(dx);
        const oy = (A.hh + B.hh + 3) - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        if (ox < oy) {
          const s = (dx >= 0 ? 1 : -1) * ox / 2;
          A.x -= s; B.x += s;
        } else {
          const s = (dy >= 0 ? 1 : -1) * oy / 2;
          A.y -= s; B.y += s;
        }
      }
    }
    for (const v of live) {
      v.x = Math.min(Math.max(v.x, v.hw + 8), w - v.hw - 8);
      v.y = Math.min(Math.max(v.y, v.hh + 8), h - v.hh - 8);
    }
  }

  for (const v of live) {
    const L = v.L;
    if (!L.ready) { L.x = v.x; L.y = v.y; L.ready = true; }
    L.x += (v.x - L.x) * 0.2;
    L.y += (v.y - L.y) * 0.2;
    L.el.style.transform = `translate(${L.x}px, ${L.y}px) translate(-50%, -50%)`;
    L.line.setAttribute('x1', v.sx); L.line.setAttribute('y1', v.sy);
    L.line.setAttribute('x2', L.x);  L.line.setAttribute('y2', L.y);
    L.dot.setAttribute('cx', v.sx);  L.dot.setAttribute('cy', v.sy);
  }
}

/* ============================================================
   Selection / UI
   ============================================================ */
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const slider = document.getElementById('explode');
const expOut = document.getElementById('expOut');
const tLabels = document.getElementById('tLabels');
const tSpin = document.getElementById('tSpin');

let selected = null;
let targetGoal = null;
let showLabels = true;

for (const def of PARTS) {
  const b = document.createElement('button');
  b.className = 'row-item';
  b.innerHTML = `<i>${String(def.no).padStart(2, '0')}</i><span>${def.n}</span>`;
  b.addEventListener('click', () => select(def));
  def.row = b;
  listEl.appendChild(b);
}
document.getElementById('cnt').textContent = PARTS.length;
document.getElementById('badge').textContent = PARTS.length + ' parts · not to scale';

function select(def) {
  if (selected === def) def = null;

  if (selected) {
    setHighlight(selected, false);
    selected.row.classList.remove('active');
  }
  selected = def;

  if (selected) {
    setHighlight(selected, true);
    selected.row.classList.add('active');
    selected.row.scrollIntoView({ block: 'nearest' });
    detailEl.innerHTML =
      `<div class="num">Part ${String(selected.no).padStart(2, '0')} · ${selected.tag}</div>` +
      `<h3>${selected.n}</h3><p>${selected.desc}</p>`;
    targetGoal = new THREE.Vector3().copy(selected.anchor).add(selected.group.position);
  } else {
    detailEl.innerHTML =
      `<div class="num">—</div><h3>Pick a component</h3>` +
      `<p>Click any part in the scene, or a row in the list, to isolate and describe it.</p>`;
    targetGoal = null;
  }

  for (const [d, L] of labels) {
    L.el.classList.toggle('muted', !!selected && d !== selected);
    L.el.classList.toggle('active', d === selected);
  }
}

tLabels.addEventListener('change', () => { showLabels = tLabels.checked; });
tSpin.addEventListener('change', () => { spinOn = tSpin.checked; controls.autoRotate = spinOn; });
document.getElementById('reset').addEventListener('click', () => {
  camera.position.copy(HOME);
  controls.target.copy(LOOK);
  targetGoal = null;
  controls.update();
});
slider.addEventListener('input', () => { targetGoal = null; });

/* ---- click-to-pick in the 3D view ---- */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 4) return;
  const r = cv.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children, true);
  if (!hits.length) { select(null); return; }
  let o = hits[0].object;
  while (o && !o.userData.part) o = o.parent;
  select(o ? o.userData.part : null);
});

/* ============================================================
   Resize + loop
   ============================================================ */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  leaderSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
new ResizeObserver(resize).observe(stage);
resize();

let t = 0.62;   // current explode amount
let tt = 0.62;  // target

renderer.setAnimationLoop(() => {
  tt = slider.value / 100;
  expOut.textContent = Math.round(tt * 100) + '%';
  t += (tt - t) * 0.14;

  for (const def of PARTS) {
    def.group.position.copy(def.group.userData.explode).multiplyScalar(t);
  }

  if (targetGoal) {
    const d = tmpV.copy(targetGoal).sub(controls.target);
    if (d.length() < 0.01) targetGoal = null;
    else {
      d.multiplyScalar(0.07);
      controls.target.add(d);
      camera.position.add(d);
    }
  }

  controls.update();
  renderer.render(scene, camera);
  updateLabels();
});
</script>
